name: CI

on:
  push:
    branches: [main]
  pull_request:

# No API keys. No provider spend. Tests run against cassettes and mocks.
env:
  EVALSTAND_OFFLINE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        # `coverage run` rather than `pytest --cov`: evalstand registers a
        # pytest plugin, so it is imported before pytest-cov starts measuring
        # and the reported figure is far below the real one.
        run: uv run coverage run -m pytest -m "not live"

      - name: Coverage
        run: uv run coverage report --show-missing

[project]
name = "evalstand"
version = "0.0.0.dev0"
description = "A local-first LLM evaluation tool for Python: write evals, run them like tests, watch results stream in."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "eval", "testing", "pytest", "ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "litellm>=1.55",
    "typer>=0.15",
    "rich>=13.9",
    "textual>=1.0",
    "watchfiles>=1.0",
    "pydantic>=2.10",
    "rapidfuzz>=3.11",
    "tenacity>=9.0",
    "pytest>=8.3",
]

[project.optional-dependencies]
examples = ["reportlab>=4.2", "pypdfium2>=4.30"]

[project.scripts]
evalstand = "evalstand.cli:main"

[project.entry-points.pytest11]
evalstand = "evalstand.plugin"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalstand"]

[tool.hatch.build.targets.sdist]
# Ship source and docs; leave development scaffolding out of the distribution.
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/PLAN.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No --cov here. evalstand registers a pytest plugin through the pytest11 entry
# point, so it is imported before pytest-cov begins measuring, and every
# module-level line reads as uncovered — api.py reported 47% when it was really
# 95%. Measure with `coverage run -m pytest` instead, which starts first.
#
# Live tests are deselected by default, not merely skipped. Skipping relies on
# no key being present; a developer with OPENAI_API_KEY exported would otherwise
# spend money on a plain `pytest`. Opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: hits a real provider API; excluded from CI (deselect with -m 'not live')",
]

[tool.coverage.run]
source = ["src/evalstand"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 80

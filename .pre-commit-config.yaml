repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # Vendored third-party assets are excluded: their bytes are pinned by a
      # digest the suite asserts, and a hook that appends a newline to one
      # silently invalidates that pin. Reformatting someone else's minified
      # file to our house style also makes it undiffable against upstream.
      - id: end-of-file-fixer
        exclude: ^src/evalstand/web/static/.*\.(js|css)$
      - id: trailing-whitespace
        exclude: ^src/evalstand/web/static/.*\.(js|css)$
      - id: detect-private-key

  # Secret scanning (guardrail 2: never commit secrets)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

site_name: evalstand
site_description: >-
  A local-first LLM evaluation tool for Python: write evals, run them like
  tests, watch results stream in.
repo_url: https://github.com/MiltonKlun/Evalstand
repo_name: MiltonKlun/Evalstand
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # The site follows the reader's own setting first, and offers a toggle.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Writing evals: writing-evals.md
      - Scorers: scorers.md
      - Traces: traces.md
      - Watching: watching.md
      - CI: ci.md
  - Decisions:
      - The ADR process: adr/0000-adr-process.md
      - 0001 The name: adr/0001-name.md
      - 0002 Design scope: adr/0002-design-scope.md
      - 0003 No variants in v1: adr/0003-no-variants-in-v1.md
      - 0004 evaluate() registers and defers: adr/0004-evaluate-registers-defers.md
      - 0005 A project-local database: adr/0005-project-local-database.md
      - 0006 Trace parenting: adr/0006-trace-parenting.md
      - 0007 LiteLLM over provider SDKs: adr/0007-litellm-over-provider-sdks.md
      - 0008 The plugin delegates execution: adr/0008-plugin-delegates-execution-to-the-runner.md

# Fail the build on a broken internal link rather than publishing one. A docs
# site that 404s inside itself costs more trust than it saves time.
strict: true

validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
